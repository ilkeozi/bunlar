[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-ingestion"
version = "0.1.0"
description = "Modular pipeline for ingesting and normalizing engineering material data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "robotexclusionrulesparser>=1.7.1",
    "sitemap-parser>=0.0.4",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["material_ingestion*"]
