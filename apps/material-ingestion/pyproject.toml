[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-ingestion"
version = "0.1.0"
description = "Modular pipeline for ingesting and normalizing engineering material data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0.0", "pdfplumber>=0.11.0"]

[project.optional-dependencies]
dev = []

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["material_ingestion*"]
