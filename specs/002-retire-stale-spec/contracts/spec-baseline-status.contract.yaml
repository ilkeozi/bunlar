openapi: 3.0.3
info:
  title: Spec Baseline Status Contract
  version: 1.0.0
  description: Documentation-level contract for active vs retired specification baselines.
paths: {}
components:
  schemas:
    SpecBaseline:
      type: object
      required:
        - feature_directory
        - status
        - title
        - created_on
      properties:
        feature_directory:
          type: string
          description: Relative path under specs/.
          pattern: '^specs/.+'
        status:
          type: string
          enum: [active, retired]
        title:
          type: string
        created_on:
          type: string
          format: date
        retired_on:
          type: string
          format: date
        retirement_reason:
          type: string
        replacement_feature_directory:
          type: string
          pattern: '^specs/.+'
    SpecPointerMetadata:
      type: object
      required:
        - feature_directory
      properties:
        feature_directory:
          type: string
          pattern: '^specs/.+'
  examples:
    ActiveBaseline:
      summary: Active baseline example
      value:
        feature_directory: specs/002-retire-stale-spec
        status: active
        title: Retire Stale Material-Ingestion Spec
        created_on: "2026-05-24"
    RetiredBaseline:
      summary: Retired baseline example
      value:
        feature_directory: specs/001-material-ingestion-refactor
        status: retired
        title: Material Ingestion Domain Refactor
        created_on: "2026-05-20"
        retired_on: "2026-05-24"
        retirement_reason: Superseded by new active baseline aligned with current implementation intent.
        replacement_feature_directory: specs/002-retire-stale-spec
